name: Build agent binaries

# Run it manually from the Actions tab, or automatically when you push a version tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Required so the Release step can create a release and attach the binaries.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Bundle agent.cjs from source (esbuild — inlines zod + shared contract.ts)
        # Rebuild the bundle from agent.ts every run so a source change can't ship
        # stale, and use the lockfile-pinned esbuild binary (not npx) so the bundler
        # itself can't drift between runs of identical source.
        run: ./node_modules/.bin/esbuild agent.ts --bundle --platform=node --target=node22 --outfile=agent.cjs

      - name: Build standalone binaries from agent.cjs
        # pkg cross-compiles all three targets from this single Linux runner.
        run: |
          npx @yao-pkg/pkg agent.cjs \
            --targets node22-win-x64,node22-linux-x64,node22-linux-arm64 \
            --public --public-packages "*" \
            --output nomyx-agent
          ls -la nomyx-agent-*

      - name: Upload binaries as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: nomyx-agent-binaries
          path: nomyx-agent-*

      # When triggered by a version tag (e.g. v0.1.0), also publish a GitHub Release
      # with the binaries attached — that's the download home for bare-metal installs.
      - name: Publish a Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: nomyx-agent-*
